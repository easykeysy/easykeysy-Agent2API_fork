<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover: let the safe areas (notch / bottom bar) be handled by env(),
     In fullscreen the content will not slip under the system bars. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="format-detection" content="telephone=no" />
<title>Agent2API</title>

<link rel="stylesheet" href="mobile.css" />

<script>
  // Language bootstrap: same parsing rules as ui/m.html / index.html (change one place and the other two must change in sync).",
  // It must come before the business scripts; otherwise the first frame renders as Simplified first, then jumps.
  //
  // The difference from the browser form: the APK's dictionary is **packaged in** (copied from ui/i18n at build time to",
  // android-www/i18n), it is not gateway-hosted, so the path is relative to this file`i18n/...`.
  (function () {
    var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
    var raw = null;
    try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* storage disabled */ }
    var locale = 'en';
    if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
      locale = raw;
    } else {
      var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
      for (var i = 0; i < tags.length; i++) {
        var tag = String(tags[i] || '').toLowerCase();
        if (!tag) continue;
        if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
        if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
        if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
        if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
        if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
      }
    }
    document.documentElement.lang = locale;
    // Simplified Chinese has no dictionary directory (a miss shows the original Simplified text); the other languages inject the manifest + each domain file.",
    if (locale === 'zh-Hans') return;
    document.write('<script src="i18n/manifest.js"><\/script>');
  })();
</script>
<script src="i18n.js"></script>

<script>
  // Theme bootstrap: fixes data-theme before the first frame, so light doesn't flash for a moment before switching to dark.",
  (function () {
    var mode = 'system';
    try { mode = localStorage.getItem('workbuddy-desktop-theme') || 'system'; } catch (e) { /* ignored */ }
    if (mode !== 'light' && mode !== 'dark') mode = 'system';
    document.documentElement.dataset.theme = mode;
    var dark = mode === 'dark' || (mode === 'system'
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      metas[i].setAttribute('content', dark ? '#0a0a0a' : '#f3f3f6');
      if (i === 0) metas[i].removeAttribute('media');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- APK  has no Service Worker: the UI comes from files inside the package, not from HTTP, so it always works offline.",
     Data requests still hit the gateway; when unreachable, each page reports its own error. -->
<script src="mobile.js"></script>
</body>
</html>
