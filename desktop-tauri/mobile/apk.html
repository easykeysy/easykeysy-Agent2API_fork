<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover：（ / ） by env() ，
     全屏时内容不会钻到系统栏下面。 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="format-detection" content="telephone=no" />
<title>Agent2API</title>

<link rel="stylesheet" href="mobile.css" />

<script>
  // ： and ui/m.html / index.html 1 then （ 1 must）。
  // must，otherwise will by 1 down 。
  //
  // and ：APK is **** （ when from ui/i18n to 
  // android-www/i18n）， not is ，path is for file `i18n/...`。
  (function () {
    var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
    var raw = null;
    try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* */ }
    var locale = 'en';
    if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
      locale = raw;
    } else {
      var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
      for (var i = 0; i < tags.length; i++) {
        var tag = String(tags[i] || '').toLowerCase();
        if (!tag) continue;
        if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
        if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
        if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
        if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
        if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
      }
    }
    document.documentElement.lang = locale;
    // no has directory（ not to ）； its manifest + file。
    if (locale === 'zh-Hans') return;
    document.write('<script src="i18n/manifest.js"><\/script>');
  })();
</script>
<script src="i18n.js"></script>

<script>
  // ： in before data-theme down ， 1 down 。
  (function () {
    var mode = 'system';
    try { mode = localStorage.getItem('workbuddy-desktop-theme') || 'system'; } catch (e) { /* ignore */ }
    if (mode !== 'light' && mode !== 'dark') mode = 'system';
    document.documentElement.dataset.theme = mode;
    var dark = mode === 'dark' || (mode === 'system'
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      metas[i].setAttribute('content', dark ? '#0a0a0a' : '#f3f3f6');
      if (i === 0) metas[i].removeAttribute('media');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- APK no has Service Worker：file， not HTTP， can 。
     数据请求照常打网关，连不上时各页面自己报错。 -->
<script src="mobile.js"></script>
</body>
</html>
