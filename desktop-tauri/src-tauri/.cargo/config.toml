# Build output is kept outside the repo tree (LAW-15.3: builds never enter the tree).
# Three levels up from the directory holding .cargo (src-tauri) = a2a-target/ under the repo parent,
# so on any machine it lands outside the clone; CI uses the workflow env CARGO_TARGET_DIR to explicitly
# pin it back into the ephemeral workspace (see .github/workflows/*; paired verbatim with the rust-cache path).
[build]
target-dir = "../../../a2a-target"

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64"]

# SQLite 等 C/C++ 依赖不继承 Rust 的 target-cpu；仅约束 Linux x86_64 目标。
[env]
CFLAGS_x86_64_unknown_linux_gnu = { value = "-march=x86-64 -mtune=generic", force = true }
CXXFLAGS_x86_64_unknown_linux_gnu = { value = "-march=x86-64 -mtune=generic", force = true }
