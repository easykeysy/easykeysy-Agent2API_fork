<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="Agent2API · Sign in">Agent2API · Sign in</title>
  <script>
    // Language bootstrap: fixes the UI language at head-parse time, then synchronously injects the dictionary (same set as index.html)
    // The parsing rules match ui/i18n.js— see the resolveLocale word-for-word identical; change one place and you must change the other).
    // The static copy on the login page is only <title>; the card content is rendered by the React island, and the inline login script on this page
    // Chinese belongs to a later batch; not touched here.
    (function () {
      var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
      var raw = null;
      try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* storage is disabled: treat as auto */ }
      var locale = 'en';
      if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
        locale = raw;
      } else {
        var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
        for (var i = 0; i < tags.length; i++) {
          var tag = String(tags[i] || '').toLowerCase();
          if (!tag) continue;
          if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
          if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
          if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
          if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
          if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
        }
      }
      document.documentElement.lang = locale;
      if (locale === 'zh-Hans') return; // no zh-Hans dictionary: a miss shows the original text
      // The login page only uses the login (title / card copy / verification state) and accounts ("Accounts")
      // two domains. The marker tells i18n.js "the dictionary has been injected"; otherwise it would treat the main panel per the manifest as
      // two dozen dictionaries (~700 KB) pulled through again—— the first screen of the login page just waits blank for a stretch.
      window.__WB_I18N_INJECTED = true;
      document.write('<script src="i18n/' + locale + '/login.js"><\/script>');
      document.write('<script src="i18n/' + locale + '/accounts.js"><\/script>');
    })();
  </script>
  <!-- Component library build (ui-kit + Tailwind, built by ui-islands): the same copy as the main panel.
       The page shell's values also go through its --ui-* tokens instead of hardcoding its own set of dark variables. -->
  <link rel="stylesheet" href="islands/ui.css">
  <style>
    /* The stylesheet keeps only the html/body and third-party widget styles: cards, brand area, and forms are all rendered by the React island
       (ui-islands/src/islands/login-page.tsx) renders with the component library's utility classes. */
    body {
      /* margin: 0 and box-sizing It is that original`* { margin:0; padding:0; box-sizing:border-box }`
         Leftover of the global reset: the component library's build deliberately omits preflight (see the comment on ui.css in index.html),
         The global reset was removed with this rewrite; without these two rules, body picks up the browser default 8px margin ——
         The page immediately gains 16px of vertical overflow and a scrollbar appears on the right. */
      margin: 0;
      box-sizing: border-box;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font: 14px/1.6 var(--ui-font-sans, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif);
      color: var(--ui-foreground);
      /* Top primary-color glow + page background: the equivalent of the original standalone page's dark-blue gradient layer, values now go through the tokens */
      background: radial-gradient(1200px 600px at 50% -10%,
        color-mix(in srgb, var(--ui-primary) 26%, var(--ui-background)) 0%,
        var(--ui-background) 55%);
    }
    /* The mount point does not generate the box itself: the card goes directly into body— see the flex sub-items participate in centering (along with the main panel's .island
       the same technique)—— an extra div in between: the card's min(400px,100%) would be measured against that layer's shrunken width
       computed; in a narrow window it is off */
    #login-app { display: contents; }
    panel-captcha { display: flex; justify-content: center; }
    #submit { margin-top: 20px; }
  </style>
  <!-- Multilingual runtime (the dictionary was already synchronously injected by the head bootstrap script above): placed after all css,
        and before the islands/login.js and panel-captcha.js at the end of the body. -->
  <script src="i18n.js"></script>
</head>
<body>
  <!-- The whole-page UI is rendered by a React island (ui-islands/src/islands/login-page.tsx, via
       islands/login.js packed separately; the island renders the card itself, and no static skeleton is written here).
       This <script> must be placed after #login-app and without defer/async: the login script below
       must synchronously obtain the island-rendered #username / #password / #submit / #error / #mode-tip. -->
  <div id="login-app"></div>
  <script src="islands/login.js"></script>

  <!-- Bot-check component (custom element definition; protocol in server::altcha and the file-header comment).
       It must come before that inline script below: the verified/expired listeners the script attaches to elements,
       as well as reset() on commit failure both require the element to already be upgraded. -->
  <script src="panel-captcha.js"></script>
  <script>
    (function () {
      'use strict';
      var $ = function (id) { return document.getElementById(id); };
      var tip = $('mode-tip');
      var errorEl = $('error');
      var button = $('submit');
      var t = function (key) { return window.wbI18n ? window.wbI18n.t(key) : key; };
      var isSetup = false;

      // ── Panel dual tokens (agent2api.panelAuth, same key as the PANEL_AUTH section in web_shim)──
      // The "host relay" entry point (panel jump hosts like the fnOS docker management page) strips HttpOnly cookies
      // Cut off: the login POST gets through but the Set-Cookie comes back, so the panel session can only rely on request headers. The login page
      // it does not go through web_shim itself, so a same-key copy of the storage is kept here.
      var PANEL_AUTH = 'agent2api.panelAuth';
      function readPanelToken(kind) {
        try {
          var auth = JSON.parse(localStorage.getItem(PANEL_AUTH) || 'null');
          var value = auth && auth[kind];
          return typeof value === 'string' && value ? value : '';
        } catch (e) { return ''; }
      }
      function storePanelTokens(access, refresh, expiresIn) {
        try {
          // `expiresAt` so panel pages know on load when to proactively renew (see the one in web_shim
          // `ensureFreshSession`)—— without it, the first expiry after login still waits for one
          // 401 was discovered. The server always sends expiresIn (even in direct-connection cookie mode).
          var seconds = Number(expiresIn);
          var expiresAt = isFinite(seconds) && seconds > 0
            ? Date.now() + seconds * 1000
            : 0;
          localStorage.setItem(PANEL_AUTH, JSON.stringify({
            access: access, refresh: refresh, expiresAt: expiresAt,
          }));
        } catch (e) { /* privacy mode, etc.: if it cannot be stored, we can only rely on cookies */ }
      }

      // ── Desktop form (inside the Tauri shell)──────────────────────────────────
      // The page source of the desktop window is`tauri://localhost`, the gateway, on`127.0.0.1:{port}` ——
      //  across origins: the HttpOnly cookie of the login response never reaches the gateway, so the cookie channel is **bound to fail** here
      // unavailable. So the desktop form is pinned to the "token in the response body + handed to the shell" channel:
      // After a successful login`panelSessionStore` write the token encrypted into the desktop settings; afterwards every admin
      // The request automatically carries`x-panel-token` header (see panel_session).
      // The definition **must** come before headerMode: the probe below is skipped wholesale in the desktop form.
      var desktop = window.workbuddyDesktop && window.workbuddyDesktop.platform !== 'web'
        ? window.workbuddyDesktop
        : null;

      var gatewayReady = desktop && typeof desktop.waitForBackend === 'function'
        ? desktop.waitForBackend().then(function (state) {
          if (!state || !Number.isInteger(state.port) || state.port < 1 || state.port > 65535) throw new Error('gateway');
          return 'http://127.0.0.1:' + state.port;
        }) : Promise.resolve('');
      function panelFetch(path, options) {
        return gatewayReady.then(function (base) { return fetch(base + path, options); });
      }

      // fnOS docker A host-relay entry like a management page strips Set-Cookie/Cookie.
      // The server plants **two** probe cookies (`/api/panel/cookie-probe` In a row
      // two probes; the second one has both cookies read back= roundtrip:true). The probe passed→ Pure cookie
      // Session: the login request carries no marker at all, and the response body has no token (consistent with the old direct-connection behavior;
      // JS cannot read any token); on failure→ The login request carries x-panel-auth-mode: body,
      // tokens only land in the response body, and localStorage is written via the header fallback. The probe measures this environment's
      // real transmission, do not guess the proxy's behavior—— whichever relay fixes the cookie first will win the regression.
      // Why it must be **two**: the login response issues two Set-Cookies (access + refresh),
      // The probe must be the same shape as it to predict it. A single probe **passes** on that relay (the value comparison
      // matches), but the login bounces back—— It joins the two into one comma-separated string,`Path=/` Therefore
      // degrades into one named`path` — see the cookie(the returned list's path|domain|max-age|
      // expires|session|version those items are the fragments), the new session did not follow`/` stored into the jar.
      var headerMode = !!desktop;
      // The probe now uses a **value comparison**: cookies are computed per host, not per port—— Relayed from fnOS (port 5666)
      // When it comes in, the browser carries the **old probe** stored from a direct :3065 connection; only judge "was there
      // present" would fool it into thinking the channel is intact (measured: it bounces back to the login page). So the first request remembers the server's
      // the value just sent; the second probe uses?expect= / ?expect-b= Let the server compare—— The value of the old probe
      //  only when they don't line up do we say it's down. Both requests use POST: same verb as login, so relays can't treat Set-Cookie differently by method.
      var probeDone = desktop
        ? Promise.resolve()
        : panelFetch('/api/panel/cookie-probe?step=1', { method: 'POST', cache: 'no-store' })
        .then(function (resp) { return resp.json(); })
        .then(function (payload) {
          var data = payload && payload.data;
          var issued = data && data.token;
          var issuedB = data && data.tokenB;
          // If one is missing, treat it as down: the server issues exactly two; one missing means the response was tampered with (or the page
          // is an old-version cache), in this kind of environment we do not dare to put the whole session on cookies
          if (!issued || !issuedB) return { roundtrip: false };
          return panelFetch('/api/panel/cookie-probe?step=2'
            + '&expect=' + encodeURIComponent(issued)
            + '&expect-b=' + encodeURIComponent(issuedB),
            { method: 'POST', cache: 'no-store' }).then(function (resp) { return resp.json(); });
        })
        .then(function (payload) {
          var data = payload && payload.data;
          headerMode = !!(data && !data.roundtrip);
        })
        .catch(function () { headerMode = true; }); // no probe can get out: treat as a relay, keep the login usable

      // Logged in (access session valid)→ go straight into the panel; 401→ Stay on this page.
      // Carry the token you hold: in relay environments cookies are absent, and the server identifies the session by this header.
      //
      // The jump carries`from=login`: the server, on`/` on it, "sessions with invalid navigation" are intercepted and bounced back to this page
      // (see server::http::panel_boot_redirect). In a relay environment the session only exists in
      // localStorage — see the `x-panel-token` header, **top-level navigation cannot carry custom headers**——
      // Without this marker, the jump after a successful login would be judged as logged out and bounced back to this page again,
      // this page re-judges "logged in" and jumps back`/`, forming an infinite loop.
      // ── Which page to return to after a successful login──────────────────────────────────
      // Phone side (`/m`) is kicked back to the login page with`?next=/m`: it should go back to the phone panel,
      // This is not the desktop panel. Whitelist check; only`/` and `/m` Two in-site paths——
      // Get`next` doing an open redirect is the most typical login-page hole; we do not leave one for ourselves here.
      function postLoginTarget() {
        var next = '';
        try { next = new URLSearchParams(window.location.search).get('next') || ''; } catch (e) { /* older browsers */ }
        if (next === '/m') return '/m?from=login';
        // Inside the desktop shell: back to the app's own UI (tauri://localhost/index.html)
        if (desktop) return '/index.html';
        return '/?from=login';
      }

      // Logged-in probe: in the desktop form ask the shell (it really hits /api/session once with the stored token,
      // and renew along the way); the web side still sends one request with the header as before.
      (function () {
        if (desktop && typeof desktop.panelSessionStatus === 'function') {
          desktop.panelSessionStatus().then(function (state) {
            if (state && state.authenticated) window.location.href = postLoginTarget();
          }).catch(function () { /* Not logged in; stay on this page */ });
          return;
        }
        var headers = {};
        var token = readPanelToken('access');
        if (token) {
          headers['x-panel-token'] = token;
          // Authorization 是标准头：连自定义请求头都剥的中转也会放它过去
          headers['Authorization'] = 'Bearer ' + token;
        }
        panelFetch('/api/session', { headers: headers }).then(function (resp) {
          if (resp.ok) window.location.href = postLoginTarget();
        }).catch(function () { /* Not logged in; stay on this page */ });
      })();

      // The verification method is given by the state endpoint; after a failure, exchange for a new token — do not treat a challenge-fetch failure as a close.
      var captchaPayload = null;
      var captchaRequired = true; // Until the probe finishes, conservatively treat it as "verification required"
      var widget = document.getElementById('captcha');

      widget.addEventListener('verified', function (event) {
        captchaPayload = (event.detail && event.detail.payload) || null;
      });
      widget.addEventListener('expired', function () {
        captchaPayload = null;
      });
      widget.addEventListener('disabled', function () {
        captchaRequired = false;
        captchaPayload = null;
        widget.style.display = 'none';
      });

      var statusKnown = false;
      var statusReady = Promise.all([
        panelFetch('/api/panel/status', { cache: 'no-store' }).then(function (response) {
          if (!response.ok) throw new Error('status');
          return response.json();
        }),
        gatewayReady,
      ]).then(function (result) {
        var data = result[0] && result[0].data;
        if (!data || typeof data.registered !== 'boolean') throw new Error('status');
        isSetup = !data.registered;
        tip.textContent = isSetup
          ? 'First-time use: create an admin account to sign in to this panel'
          : 'Enter the admin account and password';
        button.textContent = isSetup ? 'Create account and enter panel' : 'Sign in';
        if (isSetup) $('password').placeholder = 'Set a password (at least 8 characters)';
        captchaRequired = data.captchaEnabled !== false;
        widget.style.display = captchaRequired ? '' : 'none';
        if (data.captchaError) {
          errorEl.textContent = data.captchaError;
          widget.setState('error');
          return;
        }
        if (data.captchaProvider && data.captchaProvider !== 'altcha' && data.captchaProvider !== 'turnstile') throw new Error('provider');
        widget.configure({
          captchaEnabled: captchaRequired,
          captchaProvider: data.captchaProvider || 'altcha',
          turnstileSiteKey: data.turnstileSiteKey,
          gatewayBase: result[1],
        });
        statusKnown = true;
      }).catch(function () {
        tip.textContent = t('Could not read sign-in verification settings. Refresh the page and try again.');
        widget.setState('error');
      });

      async function doSubmit(username, password) {
        if (button.disabled) return;
        button.disabled = true;
        await Promise.all([probeDone, statusReady]);
        if (!statusKnown || (captchaRequired && !captchaPayload)) {
          errorEl.textContent = !statusKnown ? t('Could not read sign-in verification settings. Refresh the page and try again.') : t('Complete the human verification and try again');
          button.disabled = false;
          return;
        }
        errorEl.textContent = '';
        var body = { username: username, password: password };
        if (captchaPayload) body.captcha = captchaPayload;
        var headers = { 'Content-Type': 'application/json' };
        // The marker goes through two channels: custom header + URL parameter—— some relays strip custom request headers,
        // query cannot be stripped off (the login request reaches the server, so the query is complete)
        var markerUrl = headerMode ? '?auth-mode=body' : '';
        if (headerMode) headers['x-panel-auth-mode'] = 'body';
        panelFetch((isSetup ? '/api/panel/setup' : '/api/panel/login') + markerUrl, {
          method: 'POST',
          headers: headers,
          body: JSON.stringify(body),
        }).then(function (resp) {
          return resp.json().then(function (payload) { return { ok: resp.ok, payload: payload }; });
        }).then(function (result) {
          if (result.ok) {
            // Whether there is a token in the response body is decided by the server based on our marker: only in relay mode.
            // If there is one, first store it in localStorage, then jump to the panel (the panel and the login page share the same origin, so it can read
            // the same copy); in pure cookie mode there is no token in the body, and nothing is written here,
            // The session only exists in the HttpOnly cookie.
            var data = result.payload && result.payload.data;
            var hasTokens = data && typeof data.accessToken === 'string' && data.accessToken
              && typeof data.refreshToken === 'string' && data.refreshToken;
            if (hasTokens) {
              storePanelTokens(data.accessToken, data.refreshToken, data.expiresIn);
              // Desktop form: the token is also handed to the shell (stored encrypted on disk); afterwards every admin request is automatically
              // Carry along—— Browser localStorage is also readable under tauri://, but after the shell restarts
              // Only the copy it stores itself is still there (see panel_session).
              if (desktop && typeof desktop.panelSessionStore === 'function') {
                desktop.panelSessionStore(data.accessToken, data.refreshToken, data.expiresIn)
                  .catch(function () { /* cannot be stored: this session still works, log in again on next launch */ });
              }
            } else if (data && Number(data.expiresIn) > 0) {
              // Pure cookie mode: the token is not stored anywhere (exactly the property we want to keep),
              // but **the expiry moment must be recorded**——panel pages rely on it to decide when to proactively renew. Without recording it,
              // In a direct-connection environment, the first expiry after login still waits for one 401 — that is the noise this change removes.
              try {
                localStorage.setItem(PANEL_AUTH, JSON.stringify({
                  expiresAt: Date.now() + Number(data.expiresIn) * 1000,
                }));
              } catch (e) { /* privacy mode: fall back to "401→ renewal" old path, availability unaffected */ }
            }
            // `from=login` of it is the section "logged-in probe" above: in a relay environment the session only exists in
            // localStorage the request headers; top-level navigation cannot carry it, so the server lets this trip pass on that basis.
            // requests coming from the phone carry`?next=/m`, back to the phone panel (see postLoginTarget).
            // Inside the desktop shell there is no server-side navigation check (pages come from tauri://); it just goes back to the main UI.
            window.location.href = postLoginTarget();
            return;
          }
          var detail = result.payload && (result.payload.error || result.payload);
          // The backend's error envelope is {success:false, error:"账号或密码不正确"}, error
          // is a string; also compatible with {message:"…"} an object in that form
          if (detail && typeof detail === 'object') detail = detail.message;
          errorEl.textContent = detail || 'Request failed. Please try again.';
          button.disabled = false;
          captchaPayload = null; // payload It is one-shot: re-verify after a failure
          if (captchaRequired) widget.reset();
        }).catch(function () {
          errorEl.textContent = 'Cannot connect to the gateway';
          button.disabled = false;
          captchaPayload = null;
          if (captchaRequired) widget.reset();
        });
      }

      // capture: before the official widget— see the form the integration logic runs; give a clear hint when unverified
      $('form').addEventListener('submit', function (event) {
        event.preventDefault();
        var username = $('username').value.trim();
        var password = $('password').value;
        if (!username || !password) {
          errorEl.textContent = 'Enter the account and password';
          return;
        }
        if (captchaRequired && !captchaPayload) {
          errorEl.textContent = t('Complete the human verification and try again');
          return;
        }
        doSubmit(username, password);
      }, true);
    })();
  </script>
</body>
</html>
