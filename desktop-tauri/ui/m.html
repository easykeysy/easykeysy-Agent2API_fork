<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8" />
<!-- viewport-fit=cover: let the safe areas (notch / bottom bar) be handled by env(),
     standalone In fullscreen the content will not slip under the system bars. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- The two theme-color entries are picked per system light/dark: in a PWA this controls the status bar / address bar color.",
     The script also rewrites the first one when the theme is switched, overriding the user's manual light / dark choice. -->
<meta name="theme-color" content="#f3f3f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
<meta name="color-scheme" content="light dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- default Keeps the status bar on the system color and starts the body below the status bar; black-translucent",
      would let content slide under the status bar; we already have env(safe-area-inset-top) padding, so",
     stacking both would add an extra blank block, so it is not used. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Agent2API" />
<meta name="format-detection" content="telephone=no" />
<title>Agent2API · The phone side</title>

<!-- PWA: manifest and the icons both point at existing assets under ui/, without copying an extra copy -->
<link rel="manifest" href="m/manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/app-icon-192.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/app-icon-180.png" />

<link rel="stylesheet" href="m/mobile.css" />

<script>
  // Language bootstrap: same parsing rules as index.html / login.html (change one place and the other two must change in sync).",
  // It must come before the business scripts; otherwise the first frame renders as Simplified first, then jumps.
  (function () {
    var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
    var raw = null;
    try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* storage disabled */ }
    var locale = 'en';
    if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
      locale = raw;
    } else {
      var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
      for (var i = 0; i < tags.length; i++) {
        var tag = String(tags[i] || '').toLowerCase();
        if (!tag) continue;
        if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
        if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
        if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
        if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
        if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
      }
    }
    document.documentElement.lang = locale;
    // Simplified Chinese has no dictionary directory (a miss shows the original Simplified text); the other languages inject the manifest + each domain file.",
    if (locale === 'zh-Hans') return;
    document.write('<script src="i18n/manifest.js"><\/script>');
  })();
</script>
<script src="i18n.js"></script>

<script>
  // Theme bootstrap: fixes data-theme before the first frame, so light doesn't flash for a moment before switching to dark.",
  // and the desktop's app.js— see the applyTheme reads the same localStorage key.
  (function () {
    var mode = 'system';
    try { mode = localStorage.getItem('workbuddy-desktop-theme') || 'system'; } catch (e) { /* ignored */ }
    if (mode !== 'light' && mode !== 'dark') mode = 'system';
    document.documentElement.dataset.theme = mode;
    var dark = mode === 'dark' || (mode === 'system'
      && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    // The two theme-color entries in the page are written per system light/dark (they line up even without JS).",
    // when the user manually picked a theme, the system preference is no longer the criterion—— Strip the media from the first one,
    // and it will match unconditionally, with the second one invalidated as a result.
    var metas = document.querySelectorAll('meta[name="theme-color"]');
    for (var i = 0; i < metas.length; i++) {
      metas[i].setAttribute('content', dark ? '#0a0a0a' : '#f3f3f6');
      if (i === 0) metas[i].removeAttribute('media');
    }
  })();
</script>
</head>
<body>
<div id="root"></div>
<!-- Service Worker the registration is in the app (mobile/src/lib/pwa.ts), not here:
     After registering you still have to watch for updates, decide whether they can be installed, and maintain offline state — all of these must be shared with the UI
     The same state, placed in a page would be recorded in two places. -->
<script src="m/mobile.js"></script>
</body>
</html>
