<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- ─── PWA: makes iOS "Add to Home Screen" open as a standalone window (instead of jumping back to Safari each time)───
       iOS  only manifest display: standalone + apple-touch-icon is recognized; without this set of declarations,
       Tapping the home-screen icon falls back to Safari. Note: after adding it, the user must delete the old bookmark and re-add it. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agent2API">
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/app-icon-180.png">
  <link rel="icon" type="image/png" href="assets/app-icon-192.png">
  <title data-i18n="Agent2API · Multi-provider local gateway">Agent2API · Multi-provider local gateway</title>
  <script>
    // Works with theme persistence: stick data-theme on before CSS is parsed, so the first frame doesn't flash in dark mode
    (() => {
      const mode = localStorage.getItem('workbuddy-desktop-theme') || 'system';
      document.documentElement.dataset.theme = mode;
      const dark = mode === 'dark'
        || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      // UI zoom (the "Display" section of the settings page) is also handed off here once, ahead of time: zoom is a WebView-layer effect, so
      // there is no such thing as "set a property first" synchronously; the only option is to send the command as early as possible—— late, and the first frame will show a zoom jump.
      // This is only a **best-effort** anti-flicker: at this point the bridge (workbuddyDesktop) has already been injected by the shell (the init script
      // runs before the page scripts, but the command applies asynchronously and failures are not retried; the authoritative one is at app.js startup
      // on the path (applyZoom(storedZoom()))—— The same localStorage; reapplying has no side effects.
      const zoom = Number(localStorage.getItem('workbuddy-desktop-zoom'));
      if (Number.isFinite(zoom) && zoom >= 80 && zoom <= 130) {
        try { window.workbuddyDesktop?.setZoom?.(zoom / 100); } catch { /* open directly in a browser, ignored */ }
      }
    })();
  </script>
  <script>
    // Language bootstrap: fix the UI language at head-parse time, then synchronously inject the dictionary—— It must come before all business scripts,
    // otherwise the first frame renders as Simplified first, then jumps. The parsing rules match ui/i18n.js— see the resolveLocale Word for word
    //  (that copy is for runtime lookups; this one is for dictionary injection, because i18n.js itself also waits for this block to pick the language first;
    // change one place and you must change the other and login.html in sync).
    (function () {
      var CODES = ['zh-Hans', 'zh-Hant', 'en', 'ja', 'ko', 'pt-BR'];
      var raw = null;
      try { raw = localStorage.getItem('workbuddy-desktop-locale'); } catch (e) { /* storage is disabled: treat as auto */ }
      var locale = 'en';
      if (raw && raw !== 'auto' && CODES.indexOf(raw) >= 0) {
        locale = raw;
      } else {
        var tags = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
        for (var i = 0; i < tags.length; i++) {
          var tag = String(tags[i] || '').toLowerCase();
          if (!tag) continue;
          if (tag === 'zh-tw' || tag === 'zh-hk' || tag === 'zh-mo' || tag.indexOf('hant') >= 0) { locale = 'zh-Hant'; break; }
          if (tag.indexOf('zh') === 0) { locale = 'zh-Hans'; break; }
          if (tag.indexOf('ja') === 0) { locale = 'ja'; break; }
          if (tag.indexOf('ko') === 0) { locale = 'ko'; break; }
          if (tag.indexOf('pt') === 0) { locale = 'pt-BR'; break; }
        }
      }
      document.documentElement.lang = locale;
      // Simplified Chinese has no dictionary directory (a miss shows the original Simplified text), so no injection is needed; the other languages inject
      // **Merged dictionary ** (the build artifact i18n/combined/<locale>.js): originally 22 domain files
      // need to write 22 <script> tags, now only 1 remains. The marker tells i18n.js "the dictionary has been injected",
      // do not loop over the manifest again.
      if (locale === 'zh-Hans') return;
      window.__WB_I18N_INJECTED = true;
      document.write('<script src="i18n/combined/' + locale + '.js"><\/script>');
    })();
  </script>

  <link rel="stylesheet" href="css/page-assistant.css">
  <!-- The table column settings: must be placed after all page styles——
       Column alignment is **user configuration** and must override the per-table "which side does this column stick to" default
       (.models-table th.r / .acct-table td.cell-pick / .req-head .req-dur ...),
       it wins by cascade order, not by piling up specificity. -->
  <link rel="stylesheet" href="css/table-col-settings.css">
  <!-- Mobile adaptation layer: loaded last, breakpoint at 768px. The existing 900px collapse rules are untouched,
       Only handles real small screens under 768px: drawer sidebar + cardified tables + stacked cards -->
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="islands/ui.css">
  <!-- Multilingual runtime: lookup t() + static text scanner (the data-i18n family).
       The dictionary was already synchronously injected by the bootstrap script in the head above (document.write); this block only holds the runtime logic.
       It must come before business scripts such as units.js / app.js—— they may read window.wbI18n during load; 
       placed at the very end of the head, it is naturally satisfied. -->
  <script src="i18n.js"></script>
