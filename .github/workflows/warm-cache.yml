on:
  push:
    branches: [main]
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:

concurrency:
  group: warm-cache
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  # ── macOS（job and build.yml 1 ：macos）──────────────────
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # universal need need up （ and build.yml 1 ）
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # workspaces and build.yml 1 ，key can for up 
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      # none before （frontendDist is directory ui/），
      # cargo can ， not node/npm —— 
      - name: 预热 Rust 编译（aarch64）
        run: cargo build --release --target aarch64-apple-darwin
        working-directory: desktop-tauri/src-tauri

      - name: 预热 Rust 编译（x86_64）
        run: cargo build --release --target x86_64-apple-darwin
        working-directory: desktop-tauri/src-tauri

  # ── Windows（job and build.yml 1 ：windows）──────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 预热 Rust 编译
        run: cargo build --release
        working-directory: desktop-tauri/src-tauri

  # ── Docker ─────────────────────────────────────
  # BuildKit gha key not job ， this job not in 。
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # and docker.yml 1 cache-from/cache-to； not 、 not tag，
      # main use ， when in after 
      - name: 预热镜像构建缓存（不推送）
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
